<style>

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:'Heebo',system-ui,sans-serif;color:var(--ink);overflow:hidden}
  #map{position:absolute;inset:0;background:var(--bg);z-index:1}
  .leaflet-tile-pane{filter:brightness(.62) contrast(1.05) saturate(.7)}
  .leaflet-container{background:var(--bg);font-family:'Heebo',sans-serif}

  .toggle{position:absolute;top:16px;right:16px;z-index:1000;display:flex;
    background:rgba(21,21,27,.86);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:4px;
    box-shadow:0 8px 30px rgba(0,0,0,.55)}
  .toggle .tg{font-family:'Heebo',sans-serif;font-size:13.5px;font-weight:700;
    color:var(--muted);background:transparent;border:0;cursor:pointer;
    padding:8px 16px;border-radius:9px;transition:.18s;white-space:nowrap}
  .toggle .tg.active{background:var(--red);color:#fff}
  .toggle .tg:hover:not(.active){color:var(--ink)}

  .leaflet-tooltip.alert-tt{background:var(--panel);color:var(--ink);
    border:1px solid rgba(255,255,255,.12);border-radius:9px;
    box-shadow:0 6px 22px rgba(0,0,0,.55);font-family:'Heebo',sans-serif;
    padding:7px 11px;font-size:13px;direction:rtl;text-align:right}
  .leaflet-tooltip.alert-tt:before{display:none}
  .alert-tt .nm{font-weight:800;font-size:14px}
  .alert-tt .ct{color:var(--red);font-weight:800}
  .alert-tt .zn{color:var(--muted);font-size:11px;font-weight:300}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:rgba(255,255,255,.1)!important}
  .leaflet-control-attribution{background:rgba(10,10,12,.7)!important;color:#6b6b75!important;font-size:9px}
  .leaflet-control-attribution a{color:#8a8a95!important}
  @media (max-width:600px){.toggle .tg{font-size:12px;padding:7px 11px}}
</style>
</head>

const cities = MAP_DATA.cities;
const maxC = MAP_DATA.stats.max_count;
function radius(c){ return 3 + 22*Math.sqrt(c/maxC); }
function color(c){ const t=Math.sqrt(c/maxC);
  if(t<0.18) return '#ffb020'; if(t<0.40) return '#ff7a1a';
  if(t<0.70) return '#ff3b30'; return '#c41e1e'; }

const layer = L.layerGroup().addTo(map);
function render(field){
  layer.clearLayers();
  cities.slice().filter(c=>c[field]>0).sort((a,b)=>b[field]-a[field]).forEach(c=>{
    const v=c[field];
    const m=L.circleMarker([c.lat,c.lng],{radius:radius(v),color:'#ffffff',
      weight:0.6,opacity:0.5,fillColor:color(v),fillOpacity:0.62});

  });
}
